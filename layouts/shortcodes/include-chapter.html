{{- $page := .Page -}}
{{- $file := .Get 0 -}}
{{- $anchor := .Get 1 -}}
{{- $title := .Get 2 -}}
{{- with $page.Resources.Get $file }}
<section class="included-chapter">
  <h2 id="{{ $anchor }}">{{ $title }}</h2>
  {{ .Content }}
</section>
{{- else }}
{{- errorf "include-chapter: page resource %q not found in %q" $file $page.Path -}}
{{- end -}}
